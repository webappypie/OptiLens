[versions]
# ── Core toolchain ─────────────────────────────────────────
# NOTE: AGP 9.0+ includes Kotlin support built-in.
# org.jetbrains.kotlin.android is NO LONGER required or permitted.
agp                     = "9.4.0"
kotlin-compose          = "2.4.20"   # Compose Kotlin compiler plugin (still required separately)

# ── KSP (Kotlin Symbol Processing) ─────────────────────────
# KSP now uses independent versioning (no longer tied to Kotlin version string).
ksp                     = "2.3.4"

# ── Dependency Injection ────────────────────────────────────
hilt                    = "2.60.1"
hilt-navigation-compose = "1.4.0"

# ── AndroidX / Jetpack ─────────────────────────────────────
compose-bom             = "2026.09.00"
core-ktx                = "1.16.0"
lifecycle               = "2.9.1"
activity-compose        = "1.10.1"
navigation              = "2.10.1"
datastore               = "1.2.1"

# ── Kotlin Serialization (for Navigation type-safe routes) ──
kotlin-serialization    = "2.4.20"

# ── Testing ────────────────────────────────────────────────
junit                   = "4.13.2"
junit-ext               = "1.2.1"
espresso                = "3.6.1"
coroutines-test         = "1.10.2"
turbine                 = "1.2.0"

[libraries]
# ── AndroidX Core ──────────────────────────────────────────
androidx-core-ktx       = { group = "androidx.core",     name = "core-ktx",            version.ref = "core-ktx" }

# ── Lifecycle ──────────────────────────────────────────────
androidx-lifecycle-runtime-ktx    = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",    version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx  = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",  version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# ── Activity ───────────────────────────────────────────────
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose",  version.ref = "activity-compose" }

# ── Compose BOM ────────────────────────────────────────────
compose-bom             = { group = "androidx.compose",  name = "compose-bom",         version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics     = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4  = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# ── Navigation ─────────────────────────────────────────────
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# ── Hilt DI ────────────────────────────────────────────────
hilt-android            = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-compiler",         version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# ── DataStore ──────────────────────────────────────────────
datastore-preferences   = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ── Kotlin Serialization ───────────────────────────────────
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.8.0" }

# ── Coroutines ─────────────────────────────────────────────
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version = "1.10.2" }
kotlinx-coroutines-core    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version = "1.10.2" }

# ── Unit Testing ───────────────────────────────────────────
junit                   = { group = "junit",             name = "junit",               version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
turbine                 = { group = "app.cash.turbine",  name = "turbine",             version.ref = "turbine" }
hilt-android-testing    = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# ── Instrumented tests ─────────────────────────────────────
androidx-junit-ext      = { group = "androidx.test.ext", name = "junit",               version.ref = "junit-ext" }
androidx-espresso-core  = { group = "androidx.test.espresso", name = "espresso-core",  version.ref = "espresso" }

[plugins]
android-application     = { id = "com.android.application",                    version.ref = "agp" }
android-library         = { id = "com.android.library",                        version.ref = "agp" }
# kotlin-android is intentionally omitted: AGP 9.0+ includes Kotlin support built-in.
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin-compose" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin-serialization" }
ksp                     = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
